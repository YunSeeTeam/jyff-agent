packages:
  - packages/*
  - apps/*

allowBuilds:
  "@google/genai": true
  "@parcel/watcher": false
  esbuild: true
  protobufjs: true

catalog:
  vite-plus: 0.2.8
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8

minimumReleaseAgeExclude:
  - "@earendil-works/pi-agent-core@1.5.0"
  - "@earendil-works/pi-ai@1.5.0"
  - "@earendil-works/pi-codemode@1.5.0"
  - "@earendil-works/pi-coding-agent@1.5.0"
  - "@earendil-works/pi-mcp@1.5.0"
  - "@earendil-works/pi-schema@1.5.0"
  - "@earendil-works/pi-telemetry@1.5.0"
  - "@earendil-works/pi-tui@1.5.0"

# pnpm-workspace.yaml
overrides:
  typescript: npm:typescript-native-bridge@6.0.3-bridge.13.tsgo.7.0.2
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
